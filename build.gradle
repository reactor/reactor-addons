plugins {
	alias(libs.plugins.bnd) apply false
	alias(libs.plugins.artifactory) apply false
}

// The Artifactory plugin (applied from releaser.gradle) adds maven-publish to subprojects
// in afterEvaluate, which resets TargetJvmVersion on consumable configurations to the
// running JDK (17). This pre-registers a callback to force JVM 8 on those configurations,
// keeping them consistent with options.release = 8.
subprojects {
	plugins.withType(JavaPlugin) {
		configurations.matching { it.name == 'apiElements' || it.name == 'runtimeElements' }.configureEach { conf ->
			conf.attributes {
				attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 8)
			}
		}
	}
}

description = 'Reactor Core Addons including processors, adapters and more'

def osgiVersion(String v) {
	def m = (v =~ /^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?(?:[.-](.+))?$/)
	if (!m.matches()) {
		throw new GradleException("Cannot parse version: $v")
	}
	def major = m.group(1)
	def minor = m.group(2)
	def micro = m.group(3)
	def patch = m.group(4)
	def qualifier = m.group(5)
	// OSGi allows only 4 segments (major.minor.micro.qualifier). When patch is present,
	// base already fills all 4 segments, so any qualifier suffix is joined with '-'.
	// When absent, the qualifier opens a new OSGi segment with '.'.
	def base = patch ? "${major}.${minor}.${micro}.${patch}" : "${major}.${minor}.${micro}"
	def sep  = patch ? "-" : "."
	def result
	if (qualifier == null || qualifier.isEmpty()) {
		result = "${base}${sep}RELEASE"
		println "$v is a release, will use $result for bnd"
	}
	else if (qualifier.equalsIgnoreCase("SNAPSHOT")) {
		def sdf = new SimpleDateFormat("yyyyMMddHHmm")
		sdf.setTimeZone(TimeZone.getTimeZone("UTC"))
		def buildTimestamp = sdf.format(new Date())
		result = "${base}${sep}BUILD-$buildTimestamp"
		println "$v is a snapshot, will use $result for bnd"
	}
	else {
		result = "${base}${sep}${qualifier}"
		println "$v is neither release nor snapshot, will use $result for bnd"
	}
	return result
}

ext {
	//NOTE: all dependencies, including plugins, are defined in gradle/libs.versions.toml catalog

	jdk = JavaVersion.current().majorVersion
	jdkJavadoc = "https://docs.oracle.com/en/java/javase/$jdk/docs/api/"
	println "JDK Javadoc link for this build is ${rootProject.jdkJavadoc}"
	javadocLinks = [
		"https://projectreactor.io/docs/core/${libs.versions.reactorCore.get()}/api/",
		jdkJavadoc,
		"https://www.reactive-streams.org/reactive-streams-${libs.versions.reactiveStreams.get()}-javadoc/"
	] as String[]

	//OSGI version number
	osgiVersion = osgiVersion(version.toString())
}

apply from: "${rootDir}/gradle/releaser.gradle"

configurations.all {
  // check for updates every build
  resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
}


configure(subprojects) { project ->
  group = 'io.projectreactor.addons'

	apply plugin: 'java-library'
	apply from: "${rootDir}/gradle/setup.gradle"
	apply from: "${rootDir}/gradle/javadoc.gradle"

	tasks.withType(AbstractArchiveTask).configureEach {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}

  [compileJava, compileTestJava]*.options*.compilerArgs = ["-Xlint:varargs",
														   "-Xlint:cast",
														   "-Xlint:classfile",
														   "-Xlint:dep-ann",
														   "-Xlint:divzero",
														   "-Xlint:empty",
														   "-Xlint:finally",
														   "-Xlint:overrides",
														   "-Xlint:path",
														   "-Xlint:processing",
														   "-Xlint:static",
														   "-Xlint:try",
														   "-Xlint:deprecation",
														   "-Xlint:unchecked",
														   "-Xlint:-serial",      // intentionally disabled
														   "-Xlint:-options",     // intentionally disabled
														   "-Xlint:-fallthrough", // intentionally disabled
														   "-Xlint:-rawtypes"     // TODO enable and fix warnings
  ]

  compileJava {
	options.release = 8
  }

  compileTestJava {
	options.release = 8
	options.compilerArgs += "-parameters"
  }

  [compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

  sourceSets.test.resources.srcDirs = ["src/test/resources", "src/test/java"]

	project.tasks.withType(Test).all {
		scanForTestClasses = false
		include '**/*Tests.*'
		include '**/*Test.*'
		exclude '**/*Abstract*.*'
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(8)
		}
	}

	repositories {
		mavenCentral()
		maven { url = "https://oss.sonatype.org/content/repositories/releases/" }
		if (version.endsWith('-SNAPSHOT')) {
			mavenLocal()
			maven { url = 'https://repo.spring.io/snapshot' }
		}
		// Spring Milestone repository is required for io.projectreactor:jsr166:1.0.0.RELEASE
		maven { url = 'https://repo.spring.io/milestone' }
	}

	// dependencies that are common across all java projects
	dependencies {
		api libs.reactorCore

		// Logging
		compileOnly libs.slf4j
		testCompileOnly libs.slf4j

		// Testing
		testImplementation libs.junit4
		testImplementation libs.hamcrest
		testImplementation libs.assertj
		testImplementation libs.quickTheories
		testImplementation libs.testNg
		testImplementation libs.reactorTest

		testRuntimeOnly libs.logback
	}
}

project('reactor-adapter') {
	ext {
		shortDescription = "Reactor Adapter"
	}
	description = 'Adapters from/to RxJava2, RxJava3 and Akka'

	apply plugin: "biz.aQute.bnd.builder"

	ext {
		bndOptions = [
			"-exportcontents": "reactor.*;version=$osgiVersion;-noimport:=true",
			"-noextraheaders": "true",
			"Import-Package": [
				"!*internal*",
				"!javax.annotation",
				"*"
			].join(","),
			"Bundle-Name" : "reactor-adapter",
			"Bundle-SymbolicName" : "io.projectreactor.addons.reactor-adapter",
			"Bundle-Version" : "$osgiVersion"
		]
	}

	dependencies {
		//Optional RxJava 2 Converter
		compileOnly libs.rxJava2
		testImplementation libs.rxJava2

		//Optional RxJava 3 Converter
		compileOnly libs.rxJava3
		testImplementation libs.rxJava3

		compileOnly libs.akkaActor
		testImplementation libs.akkaActor

		testImplementation libs.reactiveStreams.tck
	}

  jar {
    manifest {
      attributes('Automatic-Module-Name': 'reactor.adapter')
    }
		bundle {
			bnd(bndOptions)
		}
  }

}

project('reactor-extra') {
	ext {
		shortDescription = "Reactor Extra"
	}
  description = 'Reactor Extra utilities, helpers and custom operators'

	apply plugin: "biz.aQute.bnd.builder"

	repositories {
		maven { url = "https://maven-eclipse.github.io/maven" }
	}

	ext {
		bndOptions = [
			"-exportcontents" : "reactor.*;version=$osgiVersion;-noimport:=true",
			"-noextraheaders": "true",
			"Import-Package": [
				"!*internal*",
				"!javax.annotation",
				"org.eclipse.*;resolution:=optional",
				"javax.swing.*;resolution:=optional",
				"*"
			].join(","),
			"Bundle-Name" : "reactor-extra",
			"Bundle-SymbolicName" : "io.projectreactor.addons.reactor-extra",
			"Bundle-Version" : "$osgiVersion"
		]
	}

	dependencies {
		compileOnly getSwtPlatform()
		testImplementation getSwtPlatform()
		testImplementation libs.reactiveStreams.tck
		testImplementation libs.mockito
	}

  jar {
    manifest {
      attributes('Automatic-Module-Name': 'reactor.extra')
    }
		bundle {
			bnd(bndOptions)
		}
  }
}

def getSwtPlatform() {
	String osname = System.properties['os.name']
	String osarch = System.properties['os.arch']
	if (osname.toLowerCase(Locale.ROOT).contains('win')) {
		if (osarch.contains("64")) {
			return libs.swt.windows64
		}
		return libs.swt.windows
	}
	if (osname.toLowerCase(Locale.ROOT).contains("nux")) {
		if (osarch.contains("64")) {
			return libs.swt.linux64
		}
		return libs.swt.linux
	}
	if (osname.toLowerCase(Locale.ROOT).contains("mac")) {
		return libs.swt.mac
	}
	throw new RuntimeException("Unknown OS/Arch: " + osname + ", " + osarch)
}
